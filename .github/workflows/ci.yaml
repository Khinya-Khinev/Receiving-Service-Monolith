name: Receiving Service Monolith CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]  # on pul request from dev to main  to show it passes CI

concurrency:
  group: ci-${{ github.ref }} # Group: only one run per group at a time
  cancel-in-progress: true    # cancels old one running workflow if the new one appears in this group

jobs:
  verify:
    name: Build, Test, Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # predefined action to download source code
        with:
          fetch-depth: 0          # for SonarQube to get all git history of commits and to understand what to check
      - uses: actions/setup-java@v4 # predefined ready set-up
        with: # settings for action
          distribution: temurin
          java-version: "25"
          cache: maven # caching maven dependency

      - run: chmod +x mvnw

      - name: Build
        run: ./mvnw -B -ntp -DskipTests package

      - name: Test
        run: ./mvnw -B -ntp test

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: >
          ./mvnw -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=Khinya-Khinev_Receiving-Service-Monolith
          -Dsonar.organization=khinya-organisation

  docker:
    name: Docker image
    needs: verify
    # building and pushing image in registry only on merging in main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read # lets the job download sources
      packages: write # lets the job push images to GitHub Container Registry

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}   # my username
          password: ${{ secrets.GITHUB_TOKEN }} # automatically crated

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
